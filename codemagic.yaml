# Codemagic: builds the apps in the cloud and sends them to testers.
#   ios-testflight   → TestFlight          setup: docs/codemagic-ios.md
#   android-internal → Play internal test  setup: docs/codemagic-android.md
#
# Start builds from the Codemagic dashboard (Start new build → pick one).
# Nothing builds on every push: the website deploys from main many times a
# day, and every build uses Codemagic minutes.

workflows:
  android-internal:
    name: Android → Play internal testing
    instance_type: linux_x2
    max_build_duration: 45

    environment:
      android_signing:
        # The upload key added under Code signing identities → Android
        # keystores. The reference name there must match this exactly.
        - true_upload_key
      groups:
        # Holds GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (secure)
        - google_play
      vars:
        PACKAGE_NAME: uk.co.trueapp.app
        VERSION_NAME: "1.0"
      node: 22        # Capacitor 8 needs Node 22 or newer
      java: 21        # and Java 21 for its Android Gradle Plugin

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the app's web bundle (www/, with native.js)
        script: npm run build:app

      - name: Copy it into the Android project
        script: npx cap sync android

      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Hand the upload key to the release build
        script: |
          # build.gradle signs from android/keystore.properties, the same file
          # used for local builds. Codemagic supplies the key as CM_* variables.
          # Backslashes are doubled because .properties treats \ as an escape.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$CM_KEYSTORE_PATH"
            echo "storePassword=$(esc "$CM_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$CM_KEY_ALIAS")"
            echo "keyPassword=$(esc "$CM_KEY_PASSWORD")"
          } > "$CM_BUILD_DIR/android/keystore.properties"

      - name: Build the signed .aab with a version code Play hasn't seen
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || true)
          NEXT="$BUILD_NUMBER"
          if [ -n "$LATEST" ] && [ "$((LATEST + 1))" -gt "$NEXT" ]; then NEXT=$((LATEST + 1)); fi
          echo "versionCode: $NEXT"
          cd "$CM_BUILD_DIR/android"
          ./gradlew bundleRelease -PversionCode="$NEXT" -PversionName="$VERSION_NAME"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Play keeps apps that have never been reviewed as drafts; switch this
        # to false once True's first release has gone through review.
        submit_as_draft: true

  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # The App Store Connect API key added under Codemagic → Team settings →
      # Integrations. The name there must match this exactly.
      app_store_connect: True App Store Connect

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.trueapp.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj   # Capacitor 8 uses Swift Package Manager: a project, no workspace
        XCODE_SCHEME: App
        # The app's Apple ID: App Store Connect → True → App Information →
        # General Information → Apple ID (a number). Until it's filled in,
        # builds fall back to Codemagic's own build counter.
        APP_STORE_APPLE_ID: ""
      node: 22        # Capacitor 8 needs Node 22 or newer
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the app's web bundle (www/, with native.js)
        script: npm run build:app

      - name: Copy it into the iOS project and resolve plugins
        script: npx cap sync ios

      - name: Apply signing profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Set a build number TestFlight hasn't seen
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          NEXT="$BUILD_NUMBER"
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
            [ "$((LATEST + 1))" -gt "$NEXT" ] && NEXT=$((LATEST + 1))
          fi
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"

      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Internal testers (people on your App Store Connect team) get each
        # build straight away. Uncomment beta_groups once there's an external
        # group of beta young people; their first build needs Apple's short
        # beta review.
        submit_to_testflight: true
        # beta_groups:
        #   - Beta young people
        submit_to_app_store: false
